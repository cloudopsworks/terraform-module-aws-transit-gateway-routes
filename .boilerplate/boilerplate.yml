# Terragrunt Boilerplate Configuration
variables:
  # Generic Boilerplate Variables Setup
  - name: is_hub
    order: 0
    description: "Is this a hub configuration?"
    type: bool
    default: false
    confirm: true
  - name: tags
    order: 1
    description: "Tags"
    type: map
    default: {}
    confirm: true
  # End - Generic Boilerplate Variables Setup
  - name: vpc_enabled
    order: 2
    description: "Enable VPC Module dependency"
    type: bool
    default: true
    confirm: true
  - name: vpc_path
    order: 3
    description: "Path to VPC Module, required if vpc_enabled is true"
    type: string
    default: "../vpc"
    confirm: true
  - name: vpc_subnets
    order: 4
    description: "VPC Subnets scope, required if vpc_enabled is true, options: intra, private, database, both(database,private), none"
    type: enum
    default: both
    options:
      - intra
      - private
      - database
      - both
      - none
    confirm: true
  - name: tgw_enabled
    order: 5
    description: "Enable TGW Module dependency"
    type: bool
    default: true
    confirm: true
  - name: tgw_path
    order: 6
    description: "Path to TGW Module, required if tgw_enabled is true"
    type: string
    default: "../tgw"
    confirm: true
  - name: tgw_route_table_source
    order: 7
    description: "Select TGW dependency output to use for transit_gateway_route_table_id, required if tgw_enabled is true"
    type: enum
    default: route-table
    options:
      - route-table
      - propagation-default
    confirm: true
  - name: tgw_att_enabled
    order: 8
    description: "Enable TGW Attachment Module dependency"
    type: bool
    default: true
    confirm: true
  - name: tgw_att_path
    order: 9
    description: "Path to TGW Attachment Module, required if tgw_att_enabled is true"
    type: string
    default: "../tgw-att"
    confirm: true

hooks:
  after:
    - command: "git"
      args: ["add", "."]
      dir: "{{ outputFolder }}"
